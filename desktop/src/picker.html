<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SAFE_Links</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 32px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; opacity: 0.85; max-width: 340px; line-height: 1.5; margin-bottom: 8px; }
  .dot { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .choices { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin-top: 20px; }
  button.choice {
    padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: left;
  }
  button.choice:hover { background: rgba(255,255,255,0.22); }
  button.choice .sub { display: block; font-size: 12px; font-weight: 400; opacity: 0.75; margin-top: 3px; }
</style>
</head>
<body>
  <!--
    Shown once, on first launch: "I'm a Reseller / Admin" vs "I'm
    pairing a router". See src/main.js's "Loading the picker" comment
    and the Android app's PickerActivity for why this exists as a
    native screen at all — short version: the web app's own text
    pointing people to /install is plain, non-clickable text (meant
    for a browser user who can type a URL), and this window has no
    address bar either.

    The choice is sent to the main process via window.ReslinkNative
    .chooseMode() (see src/preload.js), which persists it and
    navigates to the right URL. main.js's "Switch mode" menu item
    reloads this same page later without clearing the saved choice.
  -->
  <div class="dot">🔗</div>
  <h1>Welcome to SAFE_Links</h1>
  <p>What are you here to do?</p>
  <div class="choices">
    <button class="choice" onclick="window.ReslinkNative.chooseMode('reseller_admin')">
      I'm a Reseller / Admin
      <span class="sub">Sign in to your dashboard</span>
    </button>
    <button class="choice" onclick="window.ReslinkNative.chooseMode('installer')">
      I'm pairing a router
      <span class="sub">Open the router-pairing wizard</span>
    </button>
  </div>
</body>
</html>
