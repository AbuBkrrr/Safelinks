# Builds every downloadable app from source and publishes them as the
# "latest" GitHub Release, so the download links on the site always serve
# binaries built from the current code (no binaries committed to git).
#
#   safelinks-installer.exe  Windows router installer (Tauri, NSIS)
#   SAFE_Links-Setup.exe     Windows desktop app (Electron + Inno Setup)
#   safelinks-installer.apk  Android app (Capacitor)
#
# The apps carry no router script: they fetch it from the backend at setup
# time (GET /api/setup/<code>.rsc), so these builds never go stale.
name: Build apps

on:
  push:
    branches: [main, "claude/**"]
    paths: ["installer/**", "desktop/**", "android/**", ".github/workflows/build-apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Windows router installer (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: installer/src-tauri }
      - name: Build
        working-directory: installer
        run: |
          npm ci
          npx tauri build
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp installer/src-tauri/target/release/bundle/nsis/*.exe out/safelinks-installer.exe
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: out/safelinks-installer.exe }

  desktop:
    name: Windows desktop app (Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Package
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p build
          cp ../installer/src-tauri/icons/icon.ico build/icon.ico
          npm ci
          npm run package:win
      - name: Installer (Inno Setup)
        working-directory: desktop
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" SAFE_Links.iss
      - uses: actions/upload-artifact@v4
        with: { name: desktop, path: desktop/Output/SAFE_Links-Setup.exe }

  android:
    name: Android app (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../safelinks-installer.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: safelinks-installer.apk }

  release:
    name: Publish latest release
    if: github.ref == 'refs/heads/main'
    needs: [installer, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-latest
          name: SAFE_Links apps (latest)
          make_latest: true
          body: Built from ${{ github.sha }}. Router setup scripts are fetched from the backend at setup time.
          files: |
            dist/safelinks-installer.exe
            dist/SAFE_Links-Setup.exe
            dist/safelinks-installer.apk
