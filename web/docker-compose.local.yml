version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safelinks-pg-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: SAFELINKS
      POSTGRES_PASSWORD: SafeLinks_Dev_Pass_2026
      POSTGRES_DB: SAFELINKS
    volumes:
      - safelinks_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U SAFELINKS"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - safelinks_local
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safelinks-backend-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      JWT_SECRET: 8f9c3d7e2a5b1f4c9e6a3d8b7c2f5e1a9d4b7c2e5f8a1b3d6e9c2f4a7b0d3
      DATABASE_URL: postgres://SAFELINKS:SafeLinks_Dev_Pass_2026@postgres:5432/SAFELINKS
      SMTP_HOST: ''
      SMTP_PORT: 587
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: SafeLinks <no-reply@safelinks.local>
    volumes:
      - safelinks_local_uploads:/app/uploads
    networks:
      - safelinks_local
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    container_name: safelinks-frontend-local
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - safelinks_local
    ports:
      - "80:80"

volumes:
  safelinks_local_pgdata:
  safelinks_local_uploads:

networks:
  safelinks_local:
    driver: bridge
