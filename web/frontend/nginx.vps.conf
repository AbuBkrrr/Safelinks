# Self-hosted (VPS) frontend: serves the built app and forwards the API to
# the backend container on the same Docker network. Public HTTPS is handled
# by the Caddy in front of this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    aio off;
    client_max_body_size 10m;   # receipt / support uploads (base64 JSON)

    location ~ ^/(api|uploads|downloads)/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location ~* \.webmanifest$ {
        add_header Content-Type application/manifest+json;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
