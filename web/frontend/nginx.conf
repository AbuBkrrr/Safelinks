server {
    listen 3600;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable async I/O — Railway containers can't use it
    aio off;

    # ---- API reverse proxy to the backend Railway service ----
    # Frontend calls same-origin /api/*; nginx forwards to backend.
    # Avoids CORS + keeps everything on the custom domain.
    location /api/ {
        proxy_pass https://backend-services-production-78d8.up.railway.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host backend-services-production-78d8.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # PWA manifest
    location ~* \.webmanifest$ {
        add_header Content-Type application/manifest+json;
        try_files $uri =404;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}