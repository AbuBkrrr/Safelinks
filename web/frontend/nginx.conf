server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend container so the browser only sees
  # one origin. VITE_API_URL should be left unset ("" -> same-origin)
  # when building the frontend image alongside this config.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded receipt photos/PDFs (see reslink-backend/src/uploads.js) —
  # served straight from the backend's local disk, same reasoning as
  # /api/ above: keep it on one origin so the browser never needs CORS.
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
  }

  # PWA manifests need the right content-type for install prompts to
  # reliably trigger on Android/Chrome — nginx's default mime.types
  # doesn't know about .webmanifest.
  location ~* \.webmanifest$ {
    add_header Content-Type application/manifest+json;
    try_files $uri =404;
  }

  # SPA: any other path falls back to index.html so client-side routes
  # like /portal/:resellerId and /install resolve correctly on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
