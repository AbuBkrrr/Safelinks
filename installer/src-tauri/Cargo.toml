[package]
name = "safelinks-installer"
version = "0.1.0"
edition = "2021"
description = "SAFE_Links native installer"

[lib]
name = "safelinks_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"

[profile.release]
opt-level = "s"
lto = true
