<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SAFE_Links Installer</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:28px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#94a3b8; font-size:13px; margin-bottom:20px; }
  button { background:#667eea; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=text], input[type=email], input[type=password] { background:#1e293b; color:#e2e8f0; border:1px solid #334155; padding:9px 12px; border-radius:8px; font-size:13px; font-family:ui-monospace, monospace; min-width:200px; }
  input:focus { outline:none; border-color:#667eea; }
  .section { background:#1e293b44; border:1px solid #334155; border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  .section h3 { font-size:14px; margin:0 0 12px; color:#cbd5e1; }
  .status { margin:16px 0; font-size:13px; color:#94a3b8; }
  table { width:100%; border-collapse:collapse; margin-top:16px; font-size:13px; }
  th { text-align:left; padding:8px; background:#1e293b; color:#94a3b8; font-weight:600; }
  td { padding:8px; border-bottom:1px solid #1e293b; vertical-align:top; }
  tr.gateway-row { background:#667eea0f; }
  .tag { padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap; }
  .mono { font-family: ui-monospace, monospace; }
  pre { background:#1e293b; padding:14px; border-radius:8px; font-size:12px; overflow:auto; max-height:300px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:12px; cursor:pointer; transition:0.15s; }
  .card:hover { border-color:#667eea; }
  .card.active { border-color:#667eea; background:#667eea22; }
  .card .plan-name { font-weight:700; font-size:14px; color:#fff; }
  .card .plan-price { font-size:20px; font-weight:700; color:#a5b4fc; margin:6px 0; }
  .card .plan-detail { font-size:11.5px; color:#94a3b8; }
  .gw-btn { display:block; width:100%; text-align:left; margin-bottom:8px; padding:12px 16px; }
  .gw-btn.active { outline:2px solid #667eea; }
  .pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill.ok { background:#0f5132; color:#7ae0b0; }
  .pill.warn { background:#664d03; color:#ffd166; }
  .pill.bad { background:#5c1f1f; color:#ff9e9e; }
</style>
</head>
<body>
  <h1>SAFE_Links Installer</h1>
  <div class="sub">Phase 2 - Network detection and router configuration.</div>

  <div id="installerLoginPanel" class="section">
    <h3>Account</h3>
    <div id="loginForm">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <input id="loginEmail" type="email" placeholder="reseller@example.com" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button id="btnLogin">Sign in</button>
        <button id="btnCreateAccount" style="background:#334155;">Create account</button>
      </div>
      <div id="loginStatus" style="margin-top:10px; font-size:13px; color:#94a3b8;"></div>
    </div>
    <div id="signedInView" style="display:none;">
      <div id="signedInAs" style="font-size:14px; margin-bottom:10px;"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="btnRefresh">Refresh status</button>
        <button id="btnSignOut" style="background:#334155;">Sign out</button>
      </div>
    </div>
  </div>

  <div id="licensePanel" class="section" style="display:none;">
    <h3>License</h3>
    <div id="licenseStatus" style="margin-bottom:14px;"></div>

    <div id="billingPanel" style="display:none;">
      <div style="font-size:13px; color:#cbd5e1; margin-bottom:10px;">Choose a plan to activate your license</div>
      <div id="planChooser" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; margin-bottom:16px;"></div>
      <div style="font-size:13px; color:#cbd5e1; margin-bottom:10px;">Payment method</div>
      <div id="gatewayChooser" style="margin-bottom:16px;"></div>
      <div id="billingTotal" style="background:#0f172a; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:13px;"></div>
      <button id="btnPay" disabled>Continue to payment</button>
      <div id="payStatus" style="margin-top:12px; font-size:13px;"></div>
    </div>

    <div id="pendingPanel" style="display:none;">
      <div style="font-size:13px; color:#cbd5e1; margin-bottom:8px;">Waiting for payment confirmation...</div>
      <div id="pendingDetail" style="font-size:12px; color:#94a3b8;"></div>
      <div style="margin-top:12px;">
        <span class="pill warn">Polling every 5s</span>
      </div>
    </div>
  </div>

  <div id="scanSection" class="section">
    <h3>Network scan</h3>
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <button id="btnLocal">Get Local Info</button>
      <button id="btnScan">Scan LAN</button>
      <button id="btnClear" style="background:#334155;">Clear</button>
    </div>
    <div style="margin-top:10px;">
      <input id="extraSubnets" type="text" placeholder="Extra subnets (optional, e.g. 192.168.88.0/24)" style="min-width:280px;" />
    </div>
    <div class="status" id="status">Idle.</div>
    <div id="localInfo"></div>
    <table id="results" style="display:none;">
      <thead><tr><th>IP</th><th>MAC</th><th>Vendor</th><th>Web Title</th><th>Kind</th><th>Open Ports</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
  (function () {
    const invoke = window.__TAURI__.core.invoke;
    const shell = window.__TAURI__.shell;
    const TOKEN_KEY = "safelinks_installer_token";
    const USER_KEY  = "safelinks_installer_user";

    let lastPlanConfig = null;
    let selectedPlanId = null;
    let selectedProvider = null;
    let pollingHandle = null;

    function $(id) { return document.getElementById(id); }

    function renderAuth() {
      const token = localStorage.getItem(TOKEN_KEY);
      const userRaw = localStorage.getItem(USER_KEY);
      const form = $("loginForm");
      const view = $("signedInView");
      if (token && userRaw) {
        try {
          const u = JSON.parse(userRaw);
          $("signedInAs").textContent = "Signed in as " + (u.companyName || u.email);
        } catch (e) { $("signedInAs").textContent = "Signed in"; }
        form.style.display = "none";
        view.style.display = "block";
        loadPlanConfig();
      } else {
        form.style.display = "block";
        view.style.display = "none";
        $("licensePanel").style.display = "none";
        stopPolling();
      }
    }

    async function loadPlanConfig() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return;
      try {
        const cfg = await invoke("installer_plan_config", { token: token });
        lastPlanConfig = cfg;
        renderLicense(cfg);
      } catch (e) {
        $("licensePanel").style.display = "block";
        $("licenseStatus").innerHTML = "<span class='pill bad'>Failed to load license: " + String(e) + "</span>";
        $("billingPanel").style.display = "none";
        $("pendingPanel").style.display = "none";
      }
    }

    function renderLicense(cfg) {
      const panel = $("licensePanel");
      const status = $("licenseStatus");
      const billing = $("billingPanel");
      const pending = $("pendingPanel");
      const scan = $("scanSection");

      panel.style.display = "block";

      if (cfg.license_status === "active") {
        const days = Math.max(0, Math.ceil((cfg.license_expires_in_ms || 0) / 86400000));
        status.innerHTML = "<span class='pill ok'>Active - " + cfg.plan_name + " - " + days + " days left</span>";
        billing.style.display = "none";
        pending.style.display = "none";
        scan.style.display = "block";
        stopPolling();
        return;
      }

      if (cfg.pending_payment) {
        status.innerHTML = "<span class='pill warn'>Awaiting confirmation</span>";
        billing.style.display = "none";
        pending.style.display = "block";
        $("pendingDetail").textContent = "Ref: " + cfg.pending_payment.reference + " - " + cfg.pending_payment.amount + " " + (cfg.reseller_currency || "?");
        startPolling();
      } else {
        status.innerHTML = cfg.license_status === "expired"
          ? "<span class='pill bad'>Expired - please renew</span>"
          : "<span class='pill bad'>No active license</span>";
        pending.style.display = "none";
        billing.style.display = "block";
        renderPlanChooser(cfg);
      }

      scan.style.display = "block";
    }

    function renderPlanChooser(cfg) {
      const chooser = $("planChooser");
      chooser.innerHTML = "";
      const plans = cfg.plans || [];
      if (!plans.length) {
        chooser.innerHTML = "<div style='color:#94a3b8; font-size:13px;'>No plans available</div>";
        return;
      }
      if (!selectedPlanId) selectedPlanId = cfg.plan_id || plans[0].id;

      plans.forEach(function(p) {
        const div = document.createElement("div");
        div.className = "card" + (p.id === selectedPlanId ? " active" : "");
        const fallbackTag = p.fallback ? " <span class='pill warn' style='margin-left:6px;'>" + p.currency + " fallback</span>" : "";
        div.innerHTML =
          "<div class='plan-name'>" + p.name + "</div>" +
          "<div class='plan-price'>" + p.price + " " + p.currency + "</div>" +
          "<div class='plan-detail'>Up to " + p.max_clients + " clients, " + p.max_devices_per_client + " devices/client" + fallbackTag + "</div>";
        div.onclick = function () { selectedPlanId = p.id; renderPlanChooser(cfg); updateTotal(); };
        chooser.appendChild(div);
      });

      renderGatewayChooser(cfg);
      updateTotal();
    }

    async function renderGatewayChooser(cfg) {
      const wrap = $("gatewayChooser");
      wrap.innerHTML = "<div style='font-size:12px; color:#94a3b8;'>Loading providers...</div>";
      try {
        const plan = cfg.plans.find(function(p){ return p.id === selectedPlanId; }) || cfg.plans[0] || {};
        const currency = plan.currency;
        const url = "https://backend-services-production-78d8.up.railway.app/api/payments/providers" + (currency ? "?currency=" + currency : "");
        const resp = await fetch(url);
        const data = await resp.json();
        const providers = data.providers || [];
        wrap.innerHTML = "";
        if (!providers.length) {
          wrap.innerHTML = "<div style='font-size:12px; color:#fc8181;'>No payment providers configured for this currency.</div>";
          selectedProvider = null;
          $("btnPay").disabled = true;
          return;
        }
        if (!selectedProvider || providers.indexOf(selectedProvider) === -1) selectedProvider = providers[0];
        const labels = {
          flutterwave: "Flutterwave - Card, mobile money, bank",
          paystack: "Paystack - Card, USSD, bank",
          stripe: "Stripe - Card"
        };
        providers.forEach(function(prov) {
          const b = document.createElement("button");
          b.className = "gw-btn" + (prov === selectedProvider ? " active" : "");
          b.textContent = labels[prov] || prov;
          b.onclick = function () { selectedProvider = prov; renderGatewayChooser(cfg); };
          wrap.appendChild(b);
        });
        $("btnPay").disabled = false;
      } catch (e) {
        wrap.innerHTML = "<div style='font-size:12px; color:#fc8181;'>Failed to load providers: " + String(e) + "</div>";
        $("btnPay").disabled = true;
      }
    }

    function updateTotal() {
      if (!lastPlanConfig || !selectedPlanId) return;
      const p = (lastPlanConfig.plans || []).find(function(x){ return x.id === selectedPlanId; });
      if (!p) { $("billingTotal").textContent = ""; return; }
      $("billingTotal").innerHTML =
        "<div style='display:flex; justify-content:space-between;'><span>Plan:</span><strong>" + p.name + "</strong></div>" +
        "<div style='display:flex; justify-content:space-between; margin-top:6px;'><span>Amount:</span><strong>" + p.price + " " + p.currency + "</strong></div>";
    }

    $("btnPay").onclick = async function () {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token || !selectedPlanId || !selectedProvider) return;
      $("btnPay").disabled = true;
      $("payStatus").textContent = "Starting checkout...";
      $("payStatus").style.color = "#94a3b8";
      try {
        const res = await invoke("installer_license_initiate", {
          token: token,
          planId: selectedPlanId,
          provider: selectedProvider
        });
        try {
          await shell.open(res.authorizationUrl);
          $("payStatus").innerHTML = "<span class='pill ok'>Checkout opened in browser</span>";
        } catch (e) {
          $("payStatus").innerHTML = "<span class='pill warn'>Auto-open failed: " + String(e) + ". Copy URL: " + res.authorizationUrl + "</span>";
          try { window.open(res.authorizationUrl, "_blank"); } catch (_) {}
        }
        startPolling();
      } catch (e) {
        $("payStatus").innerHTML = "<span class='pill bad'>" + String(e) + "</span>";
      } finally {
        $("btnPay").disabled = false;
      }
    };

    function startPolling() {
      stopPolling();
      pollingHandle = setInterval(async function () {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) { stopPolling(); return; }
        try {
          const cfg = await invoke("installer_plan_config", { token: token });
          lastPlanConfig = cfg;
          if (cfg.license_status === "active") {
            stopPolling();
            renderLicense(cfg);
          } else if (cfg.pending_payment) {
            $("licenseStatus").innerHTML = "<span class='pill warn'>Awaiting confirmation</span>";
            $("pendingDetail").textContent = "Ref: " + cfg.pending_payment.reference + " - " + cfg.pending_payment.amount + " " + (cfg.reseller_currency || "?");
          }
        } catch (e) { /* keep polling */ }
      }, 5000);
    }
    function stopPolling() {
      if (pollingHandle) { clearInterval(pollingHandle); pollingHandle = null; }
    }

    $("btnLogin").onclick = async function () {
      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      const st = $("loginStatus");
      if (!email || !password) { st.textContent = "Enter email and password."; return; }
      st.textContent = "Signing in...";
      st.style.color = "#94a3b8";
      try {
        const res = await invoke("installer_login", { email: email, password: password });
        localStorage.setItem(TOKEN_KEY, res.token);
        localStorage.setItem(USER_KEY, JSON.stringify(res.user));
        st.textContent = "Signed in.";
        st.style.color = "#48bb78";
        renderAuth();
      } catch (e) {
        st.textContent = String(e);
        st.style.color = "#fc8181";
      }
    };

    $("btnCreateAccount").onclick = async function () {
      const st = $("loginStatus");
      st.textContent = "Opening signup in browser...";
      try {
        await shell.open("https://www.safelinks.name.ng/signup");
        st.textContent = "Complete signup, then return and click Sign in.";
      } catch (e) {
        st.textContent = "Could not open browser: " + String(e);
        st.style.color = "#fc8181";
      }
    };

    $("btnSignOut").onclick = function () {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      lastPlanConfig = null;
      selectedPlanId = null;
      selectedProvider = null;
      stopPolling();
      renderAuth();
    };

    $("btnRefresh").onclick = function () { loadPlanConfig(); };

    $("btnClear").onclick = function () {
      document.querySelector("#results tbody").innerHTML = "";
      $("results").style.display = "none";
      $("localInfo").innerHTML = "";
      $("status").textContent = "Idle.";
    };

    $("btnLocal").onclick = async function () {
      try {
        const info = await invoke("local_info");
        $("localInfo").innerHTML = "<pre class='mono'>Local IP:  " + info.ip + "\nSubnet:    " + info.subnet + "</pre>";
      } catch (e) { $("status").textContent = "Error: " + e; }
    };

    $("btnScan").onclick = async function () {
      const btn = $("btnScan");
      btn.disabled = true;
      $("status").textContent = "Scanning...";
      const tbody = document.querySelector("#results tbody");
      tbody.innerHTML = "";
      $("results").style.display = "none";
      try {
        const extras = ($("extraSubnets").value || "").split(",").map(function(s){return s.trim();}).filter(Boolean);
        const devices = await invoke("scan_lan", { extraSubnets: extras.length ? extras : null });
        $("status").textContent = "Found " + devices.length + " device(s).";
        devices.forEach(function(d) {
          const tr = document.createElement("tr");
          if (d.is_gateway) tr.className = "gateway-row";
          tr.innerHTML =
            "<td class='mono'>" + d.ip + "</td>" +
            "<td class='mono'>" + (d.mac || "-") + "</td>" +
            "<td>" + (d.vendor || "-") + (d.is_gateway ? " <span class='pill ok'>IMMEDIATE ROUTER</span>" : "") + "</td>" +
            "<td>" + (d.web_title || "-") + "</td>" +
            "<td><span class='tag " + d.kind + "'>" + d.kind + "</span></td>" +
            "<td class='mono'>" + ((d.open_ports && d.open_ports.join(", ")) || "-") + "</td>";
          tbody.appendChild(tr);
        });
        $("results").style.display = devices.length ? "" : "none";
      } catch (e) { $("status").textContent = "Error: " + e; }
      finally { btn.disabled = false; }
    };

    window.addEventListener("DOMContentLoaded", renderAuth);
    renderAuth();
  })();
</script>
</body>
</html>
