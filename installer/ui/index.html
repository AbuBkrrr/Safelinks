<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SAFE_Links Installer — LAN Scanner</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:28px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#94a3b8; font-size:13px; margin-bottom:20px; }
  button { background:#667eea; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=text] { background:#1e293b; color:#e2e8f0; border:1px solid #334155; padding:9px 12px; border-radius:8px; font-size:13px; font-family:ui-monospace, 'Cascadia Mono', monospace; min-width:240px; }
  input[type=text]:focus { outline:none; border-color:#667eea; }
  .status { margin:16px 0; font-size:13px; color:#94a3b8; }
  table { width:100%; border-collapse:collapse; margin-top:16px; font-size:13px; }
  th { text-align:left; padding:8px; background:#1e293b; color:#94a3b8; font-weight:600; }
  td { padding:8px; border-bottom:1px solid #1e293b; vertical-align:top; }
  .tag { padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap; }
  .router-mikrotik { background:#f59e0b22; color:#f59e0b; border:1px solid #f59e0b55; }
  .router-openwrt  { background:#22c55e22; color:#22c55e; border:1px solid #22c55e55; }
  .router-ubiquiti { background:#3b82f622; color:#3b82f6; border:1px solid #3b82f655; }
  .router-tplink   { background:#a855f722; color:#a855f7; border:1px solid #a855f755; }
  .router          { background:#22c55e22; color:#22c55e; border:1px solid #22c55e55; }
  .router-likely   { background:#3b82f622; color:#3b82f6; border:1px solid #3b82f655; }
  .unknown-with-ports { background:#64748b22; color:#94a3b8; border:1px solid #64748b55; }
  .device          { background:#1e293b; color:#94a3b8; }
  .mono { font-family: ui-monospace, 'Cascadia Mono', monospace; }
  pre { background:#1e293b; padding:14px; border-radius:8px; font-size:12px; overflow:auto; max-height:300px; }
  .title-cell { font-size:11px; color:#64748b; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-hint { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; font-size:12px; color:#94a3b8; }
</style>
</head>
<body>
  <h1>SAFE_Links Installer</h1>
  <div class="sub">Phase 1 — Universal LAN detection engine (multi-subnet).</div>

  <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
    <button id="btnLocal">Get Local Info</button>
    <button id="btnScan">Scan LAN</button>
    <button id="btnClear" style="background:#334155;">Clear</button>
  </div>

  <div class="row-hint">
    <span>Extra subnets to scan (comma-separated, optional):</span>
    <input id="extraSubnets" type="text" placeholder="192.168.88.0/24, 10.0.0.0/24" />
  </div>

  <div class="status" id="status">Idle.</div>
  <div id="localInfo"></div>
  <table id="results" style="display:none;">
    <thead><tr><th>IP</th><th>MAC</th><th>Vendor</th><th>Web Title</th><th>Kind</th><th>Open Ports</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
const { invoke } = window.__TAURI__.core;
const statusEl = document.getElementById('status');
const localEl  = document.getElementById('localInfo');
const tbl      = document.getElementById('results');
const tbody    = tbl.querySelector('tbody');
const extraEl  = document.getElementById('extraSubnets');

document.getElementById('btnClear').onclick = () => {
  tbody.innerHTML=''; tbl.style.display='none'; localEl.innerHTML=''; statusEl.textContent='Idle.';
};

document.getElementById('btnLocal').onclick = async () => {
  try {
    const info = await invoke('local_info');
    localEl.innerHTML = `<pre class="mono">Primary IP:  ${info.ip}\nAll subnets:  ${info.subnet}</pre>`;
  } catch (e) { statusEl.textContent = 'Error: ' + e; }
};

document.getElementById('btnScan').onclick = async () => {
  const btn = document.getElementById('btnScan');
  btn.disabled = true;
  statusEl.textContent = 'Scanning all local + routed + default + extra subnets in parallel… (~20s)';
  tbody.innerHTML=''; tbl.style.display='none';
  const t0 = Date.now();
  const extras = (extraEl.value || '').split(',').map(s => s.trim()).filter(Boolean);
  try {
    const devices = await invoke('scan_lan', { extraSubnets: extras.length ? extras : null });
    const ms = Date.now() - t0;
    statusEl.textContent = `Found ${devices.length} device(s) in ${(ms/1000).toFixed(1)}s.`;
    for (const d of devices) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="mono">${d.ip}</td>
        <td class="mono">${d.mac || '—'}</td>
        <td>${d.vendor || '—'}</td>
        <td class="title-cell" title="${(d.web_title||'').replace(/"/g,'&quot;')}">${d.web_title || '—'}</td>
        <td><span class="tag ${d.kind}">${d.kind}</span></td>
        <td class="mono">${d.open_ports.join(', ') || '—'}</td>`;
      tbody.appendChild(tr);
    }
    tbl.style.display = devices.length ? '' : 'none';
  } catch (e) {
    statusEl.textContent = 'Error: ' + e;
  } finally { btn.disabled = false; }
};
</script>
</body>
</html>
