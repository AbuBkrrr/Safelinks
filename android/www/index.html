<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SAFE_Links</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 32px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; opacity: 0.85; max-width: 320px; line-height: 1.5; }
  .dot { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; font-size: 26px; }
</style>
</head>
<body>
  <!-- This screen only shows if the app can't reach the server configured
       in capacitor.config.json (server.url) — either no internet, or that
       URL hasn't been pointed at a real deployment yet. It is NOT the app
       itself; that's loaded live from your server, whichever dashboard a
       signed-in user lands on. -->
  <div class="dot">📡</div>
  <h1>SAFE_Links</h1>
  <p>Can't reach the server right now. Check your connection, or if you're
     seeing this right after installing the app, the server address in the
     app hasn't been configured yet — contact your administrator.</p>
</body>
</html>
